
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼仮Page</title>
    <style>
        :root {
            --main-blue: #a0c4ff;
            --main-purple: #bdb2ff;
            --bg-gradient: linear-gradient(135deg, #e4c1f9 0%, #a9def9 50%, #d0f4de 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #6c757d;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

.container {
            width: 100%;
            max-width: 800px; /* 横幅を広く */
            min-height: 600px; 
            padding: 60px 50px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(189, 178, 255, 0.35);
            border: 4px solid #ffffff;
            box-sizing: border-box;
            animation: floatCard 6s ease-in-out infinite;
            text-align: center;
        }

        /* ふわふわ浮遊するアニメーション */
        @keyframes floatCard {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #7b2cbf;
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(189, 178, 255, 0.5);
        }

        p {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .cute-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--main-blue), var(--main-purple));
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(160, 196, 255, 0.4);
            transition: all 0.3s ease;
        }

        .cute-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(189, 178, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the World</h1>
        <p>sample</p>
        <a href="#" class="cute-button">Click Me!</a>
    </div>

</body>
</html>
