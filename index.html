<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>依頼仮Page</title>
    <style>
        :root {
            --main-blue: #a0c4ff;
            --main-purple: #bdb2ff;
            --bg-gradient: linear-gradient(135deg, #e4c1f9 0%, #a9def9 50%, #d0f4de 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #6c757d;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px; /* 横幅を広く */
            min-height: 600px; 
            padding: 60px 50px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(189, 178, 255, 0.35);
            border: 4px solid #ffffff;
            box-sizing: border-box;
            animation: floatCard 6s ease-in-out infinite;
            text-align: center;
        }

        /* ふわふわ浮遊するアニメーション */
        @keyframes floatCard {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #7b2cbf;
            font-size: 2rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(189, 178, 255, 0.5);
        }

        /* ----- タブのスタイル ----- */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
        }

        .tab-btn {
            flex: 1; /* 3つのボタンを均等幅に */
            padding: 12px 15px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.6);
            color: #7b2cbf;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            outline: none;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* 選択されているタブのスタイル */
        .tab-btn.active {
            background: linear-gradient(135deg, var(--main-blue), var(--main-purple));
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 6px 15px rgba(189, 178, 255, 0.5);
        }

        /* ----- タブコンテンツのスタイル ----- */
        .tab-panel {
            display: none; /* デフォルトは非表示 */
            animation: fadeIn 0.4s ease;
        }

        .tab-panel.active {
            display: block; /* アクティブなものだけ表示 */
        }

        /* 切り替え時のふんわり表示アニメーション */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        p {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .cute-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--main-blue), var(--main-purple));
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(160, 196, 255, 0.4);
            transition: all 0.3s ease;
        }

        .cute-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(189, 178, 255, 0.6);
        }

        /* ----- スマホ対応 (レスポンシブ) ----- */
        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
                border-radius: 25px;
                min-height: auto;
            }

            h1 {
                font-size: 1.5rem;
            }

            .tab-menu {
                gap: 6px; /* スマホでは間隔を小さく */
            }

            .tab-btn {
                padding: 10px 6px;
                font-size: 0.8rem; /* スマホで文字がはみ出ないよう調整 */
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the World</h1>

        <!-- タブボタン (3つ) -->
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab(event, 'tab1')">トップページ</button>
            <button class="tab-btn" onclick="switchTab(event, 'tab2')">イベント</button>
            <button class="tab-btn" onclick="switchTab(event, 'tab3')">資料室</button>
            <button class="tab-btn" onclick="switchTab(event, 'tab4')">今後の予定</button>
        </div>

        <!-- タブ1のコンテンツ -->
        <div id="tab1" class="tab-panel active">
            <p>ようこそ！<br>ここに自己紹介とか入れる予定。</p>
            <a href="#" class="cute-button">Click Me! 1</a>
        </div>

        <!-- タブ2のコンテンツ -->
        <div id="tab2" class="tab-panel">
            <p>2つ目のタブです。</p>
        </div>

        <!-- タブ3のコンテンツ -->
        <div id="tab3" class="tab-panel">
            <p>3つ目のタブです。</p>
        </div>
        <!-- タブ4のコンテンツ -->
        <div id="tab4" class="tab-panel">
            <p>4つ目のタブです。</p>
        </div>
    </div>

    <script>
        function switchTab(event, tabId) {
            // 全てのタブパネルを非表示にする
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            // 全てのタブボタンのアクティブ状態を解除する
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // クリックされたタブと対象のパネルに active クラスを付与する
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
